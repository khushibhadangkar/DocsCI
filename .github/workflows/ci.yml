name: Documentation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Test, and Validate Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Python linter
        run: ruff check .

      - name: Run Pytest with test coverage (fail under 85%)
        run: pytest --cov=docsci --cov-report=term-missing --cov-fail-under=85

      - name: Run DocsCI linter on project documentation
        run: docsci lint docs/ --format github --strict

      - name: Run DocsCI link checker on project documentation
        run: docsci links docs/ --format github --strict

      - name: Run DocsCI linter on sample documentation
        run: docsci lint sample_docs/ --format github --strict

      - name: Run DocsCI link checker on sample documentation
        run: docsci links sample_docs/ --format github --strict

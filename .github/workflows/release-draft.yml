name: Draft Release Notes

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release-draft:
    name: Generate Verified Release Notes Draft
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install DocsCI
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate AI-assisted verified release draft
        run: |
          docsci release-notes \
            --to ${{ github.ref_name }} \
            --ai-summary \
            --output RELEASE_NOTES_DRAFT.md
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload draft artifact (Requires Human Review)
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-draft-${{ github.ref_name }}
          path: RELEASE_NOTES_DRAFT.md
          if-no-files-found: error
          retention-days: 30
